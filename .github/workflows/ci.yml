name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install -r requirements.txt pytest ziglang
      - name: Build A* core (Linux)
        if: runner.os == 'Linux'
        run: sh build.sh
      - name: Build A* core (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat
      - name: Core loads
        run: python -c "import route2; print('A* core OK')"
      - name: Tests (incl. full demo board routing; KiCad tests are skipped without KiCad)
        run: python -m pytest -q -rfEs --tb=short
